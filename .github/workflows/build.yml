name: Build

# PRs build the libraries. On main, a new rclone version in go.mod builds them and publishes the release
# v<rclone version>; a manual run rebuilds them and replaces the release's files.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a PR replaces the running build; on main the runs queue, so a release is created only once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check for the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(go list -m -f '{{.Version}}' github.com/rclone/rclone)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: github.event_name != 'push' || steps.release.outputs.exists != 'true'

      - name: Install the NDK
        if: github.event_name != 'push' || steps.release.outputs.exists != 'true'
        run: (yes || true) | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null

      - name: Build
        if: github.event_name != 'push' || steps.release.outputs.exists != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./build.sh

      - name: Publish the release
        if: github.event_name != 'pull_request' && steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "rclone $TAG" --notes "rclone $TAG for Android. Changes: https://rclone.org/changelog/"

      - name: Replace the release files
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
